    items: [Atta 5kg, Desi Ghee 1L, Tea 500g, Basmati Rice 5kg, Namkeen, Biscuits,
            Mustard Oil 1L, Garam Masala, Paneer 200g, Toor Dal 1kg]
  home_kitchen:
