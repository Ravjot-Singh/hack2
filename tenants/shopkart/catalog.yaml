# ShopKart catalog definition, used by the synthetic data generator.
# Brands are fictional. Prices are in rupees.
#   margin_pct    gross margin on the category; later used to cap discounts
#   return_rate   share of items sent back (fashion is high, grocery almost none)
#   median_price  typical product price; prices spread around it (price_sigma, log scale)
#   repeat_qty    max quantity per line (groceries are bought in multiples)

products_per_category: 50

categories:
  electronics:
    label: Electronics
    margin_pct: 8
    return_rate: 0.07
    median_price: 2499
    price_sigma: 1.0
    repeat_qty: 1
    brands: [Zentro, Voltix, Nexa, Pixelon, Auralux, Kryo]
    items: [Wireless Earbuds, Smartwatch, Power Bank, Bluetooth Speaker, Smartphone, Laptop,
            Trimmer, Monitor, Keyboard, Mouse, Tablet, Neckband Headphones]
  fashion:
    label: Fashion
    margin_pct: 45
    return_rate: 0.22
    median_price: 799
    price_sigma: 0.6
    repeat_qty: 1
    brands: [Rangrez, Urban Thread, Phulkari House, StrideOn, Kesar & Co, Denimwala]
    items: [Kurta, T-Shirt, Jeans, Saree, Sneakers, Sandals, Shirt, Dress, Track Pants,
            Jacket, Handbag, Dupatta]
  grocery:
