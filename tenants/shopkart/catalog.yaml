  beauty:
    label: Beauty & Personal Care
    margin_pct: 40
    return_rate: 0.04
    median_price: 399
    price_sigma: 0.6
    repeat_qty: 2
    brands: [Glowveda, Haldi Herbals, Mirror Mirror, Kesari Skin, Groomed, Nimbu Naturals]
